<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Informe sobre el desarrollo de las programaciones didácticas</title>
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/alertas.css}" />
</head>
<body>
<h2>Informe sobre el desarrollo de las programaciones didácticas</h2>
<div th:if="${mensaje}"
     id="alerta"
     class="alert"
     role="alert"
     th:classappend="${tipo}">
    <p th:text="${mensaje}"></p>
    <button type="button"
            onclick="document.getElementById('alerta').style.display='none'">X</button>
</div>
<div class="contenedor-formulario">
    <div class="encabezado">
        <h2 th:id="${'asignatura-' + asignatura.asignaturaId}"
            class="asignatura"
            th:text="${asignatura.nombre}">
        </h2>

        <h3 th:id="${'docente-' + docente.docenteId}"
            class="docente"
            th:text="${docente.nombre}">
        </h3>

        <h3 th:id="${'grupo-' + grupo.grupoId}"
            class="grupo"
            th:text="${grupo.nombre}">
        </h3>
    </div>

    <form th:action="@{/formulario/guardar}"
          th:object="${resultado}"
          method="post">

        <input type="hidden" th:field="*{asignaturaId}" />
        <input type="hidden" th:field="*{docenteId}" />
        <input type="hidden" th:field="*{grupoId}" />

        <h3>Temas didácticos de la programación</h3>

        <div class="contenedor-temas">
            <div th:each="tema, iterStat : ${temas}"
                 th:id="'tema-' + ${tema.temaId}"
                 class="tema">

                <p style="font-weight: bold"
                   th:text="${tema.nombre} + ' (' + ${asignatura.nombre} + ' - ' + ${asignatura.nivel} + ')'">
                </p>

                <input type="hidden"
                       th:name="'temasResultados[' + ${iterStat.index} + '].temaId'"
                       th:value="${tema.temaId}" />

                <p class="opcion-1">
                    <input type="hidden"
                           th:name="'_temasResultados[' + ${iterStat.index} + '].desarrollada'"
                           value="on" />

                    <input type="checkbox"
                           th:id="'opcion1-' + ${iterStat.index}"
                           th:field="*{temasResultados[__${iterStat.index}__].desarrollada}" />

                    <label th:for="'opcion1-' + ${iterStat.index}">
                        Ha sido desarrollada en su totalidad
                    </label>
                </p>

                <p class="opcion-2">
                    <input type="hidden"
                           th:name="'_temasResultados[' + ${iterStat.index} + '].evaluada'"
                           value="on" />

                    <input type="checkbox"
                           th:id="'opcion2-' + ${iterStat.index}"
                           th:field="*{temasResultados[__${iterStat.index}__].evaluada}" />

                    <label th:for="'opcion2-' + ${iterStat.index}">
                        Ha sido evaluada
                    </label>
                </p>

                <p class="opcion-3">
                    <textarea th:id="'opcion3-' + ${iterStat.index}"
                              th:field="*{temasResultados[__${iterStat.index}__].observaciones}"
                              placeholder="Observaciones..."></textarea>
                </p>
            </div>
        </div>

        <h3>Resultados obtenidos</h3>

        <div class="resultados">
            <p>
                <label for="alumnosGrupo">
                    <b>¿Cuántos alumnos hay en el grupo?</b>
                </label>
            </p>

            <input type="number"
                   id="alumnosGrupo"
                   th:field="*{respuesta.numeroAlumnosGrupo}"
                   min="0"
                   required />

            <p>
                <label for="alumnosAprobados">
                    <b>¿Cuántos alumnos han aprobado?</b>
                </label>
            </p>

            <input type="number"
                   id="alumnosAprobados"
                   th:field="*{respuesta.numeroAlumnosAprobados}"
                   min="0"
                   required />
        </div>

        <h3>Dificultades que ha encontrado</h3>

        <div class="dificultades">
            <p>
                <input type="hidden"
                       name="_respuesta.difEscasoHabito"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difEscasoHabito"
                       th:field="*{respuesta.difEscasoHabito}" />

                <label for="difEscasoHabito">
                    Escaso hábito de trabajo y estudio por parte del alumnado
                </label>
            </p>

            <p>
                <input type="hidden"
                       name="_respuesta.difFaltaMotivacion"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difFaltaMotivacion"
                       th:field="*{respuesta.difFaltaMotivacion}" />

                <label for="difFaltaMotivacion">
                    Falta de motivación por parte del alumnado
                </label>
            </p>

            <p>
                <input type="hidden"
                       name="_respuesta.difBajoNivel"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difBajoNivel"
                       th:field="*{respuesta.difBajoNivel}" />

                <label for="difBajoNivel">
                    Bajo nivel académico por parte del alumnado
                </label>
            </p>

            <p>
                <input type="hidden"
                       name="_respuesta.difPocaColaboracion"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difPocaColaboracion"
                       th:field="*{respuesta.difPocaColaboracion}" />

                <label for="difPocaColaboracion">
                    Poca colaboración por parte de la familia
                </label>
            </p>

            <p>
                <input type="hidden"
                       name="_respuesta.difInfluenciaClima"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difInfluenciaClima"
                       th:field="*{respuesta.difInfluenciaClima}" />

                <label for="difInfluenciaClima">
                    Influencia del clima en el aula
                </label>
            </p>

            <p>
                <input type="hidden"
                       name="_respuesta.difCarenciaMedios"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difCarenciaMedios"
                       th:field="*{respuesta.difCarenciaMedios}" />

                <label for="difCarenciaMedios">
                    Carencia de medios audiovisuales o informáticos, etc.
                </label>
            </p>

            <p>
                <input type="hidden"
                       name="_respuesta.difMalAmbiente"
                       value="on" />

                <input class="opcion-dificultad"
                       type="checkbox"
                       id="difMalAmbiente"
                       th:field="*{respuesta.difMalAmbiente}" />

                <label for="difMalAmbiente">
                    Mal ambiente de trabajo
                </label>
            </p>

            <p>
                <label for="difOtra">Otra:</label>
                <textarea class="opcion-dificultad"
                          id="difOtra"
                          th:field="*{respuesta.difOtra}"></textarea>
            </p>
        </div>

        <h3>Propuestas de mejora</h3>

        <div class="propuestas">
            <label for="propuestas">Propuestas:</label>
            <textarea id="propuestas"
                      th:field="*{respuesta.propuestasMejora}"></textarea>
        </div>

        <button class="boton-guardar" type="submit">
            Guardar
        </button>
    </form>
</div>
<div class="cerrar-sesion-boton">
    <a th:href="@{/logout}">Cerrar sesión</a>
</div>
<div class="cancelar-boton">
    <a th:href="@{/}">Cancelar</a>
</div>
</body>
</html>
