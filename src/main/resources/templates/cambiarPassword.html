<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cambiar contraseña</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>
  <body>
      <h2>Cambiar contraseña</h2>
      <div
        th:if="${alert != null}"
        class="alert alert-success"
        th:text="${alert}"
      ></div>
      <div class="container">
        <form
          th:action="@{/changePassword}"
          method="post"
          th:object="${usuario}"
        >
          <input type="hidden" th:field="*{username}" />

          <label class="title" for="passwordActual">Contraseña actual:</label>
          <input
            class="text"
            type="password"
            id="passwordActual"
            th:field="*{passwordActual}"
            required
          />
          <label class="title" for="password">Nueva contraseña:</label>
          <input
            class="text"
            type="password"
            id="password"
            th:field="*{password}"
            required
          />
          <label class="title" for="passwordConf">Confirmación:</label>
          <input
            class="text"
            type="password"
            id="passwordConf"
            th:field="*{confirmacion}"
            required
          />
          <div class="button-container">
            <button class="button" type="submit">Guardar</button>
          </div>
        </form>
      </div>
    </div>
    <div class="cerrar-sesion-boton">
      <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
    <div class="cancelar-boton">
      <a th:href="@{/}">Cancelar</a>
    </div>
  </body>
</html>
