<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cambiar contraseña</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link rel="stylesheet" th:href="@{/css/alertas.css}" />
  </head>
  <body>
      <h2>Cambiar contraseña</h2>
      <div th:if="${mensaje}"
           id="alerta"
           class="alert"
           role="alert"
           th:classappend="${tipo}">
        <p th:text="${mensaje}"></p>
        <button type="button"
                onclick="document.getElementById('alerta').style.display='none'">X</button>
      </div>
      <div class="container">
        <form
          th:action="@{/changePassword}"
          method="post"
          th:object="${usuario}"
          th:if="${isDemo}"
        >
          <input type="hidden" th:field="*{username}" />

          <label class="title" for="passwordActual">Contraseña actual:</label>
          <input
            class="text"
            type="password"
            id="passwordActual"
            th:field="*{passwordActual}"
            required
          />
          <label class="title" for="password">Nueva contraseña:</label>
          <input
            class="text"
            type="password"
            id="password"
            th:field="*{password}"
            required
          />
          <label class="title" for="passwordConf">Confirmación:</label>
          <input
            class="text"
            type="password"
            id="passwordConf"
            th:field="*{confirmacion}"
            required
          />
          <div class="button-container">
            <button class="button" type="submit">Guardar</button>
          </div>
        </form>
        <p th:unless="${isDemo}">
          El cambio de contraseña no está habilitado para esta versión.
        </p>
      </div>
    </div>
    <div class="cerrar-sesion-boton">
      <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
    <div class="cancelar-boton">
      <a th:href="@{/}">Cancelar</a>
    </div>
  </body>
</html>
